name: Daily News Post to Bluesky

on:
  schedule:
    - cron: "0 22 * * *"  # 毎日 07:00 JST (UTC 22:00)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r auto_post/requirements.txt

      - name: Run Bluesky poster
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python auto_post/bluesky_poster.py
